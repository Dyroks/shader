# ---- Volumetric clouds (lib/clouds) -------------------------------------------------------
#ifdef VOLUMETRIC_CLOUDS
iris.features.required = COMPUTE_SHADERS CUSTOM_IMAGES
customTexture.cloudNoiseBase = textures/clouds/noise_base.dat TEXTURE_3D RGBA8 128 128 128 RGBA UNSIGNED_BYTE
customTexture.cloudNoiseDetail = textures/clouds/noise_detail.dat TEXTURE_3D RGBA8 32 32 32 RGBA UNSIGNED_BYTE
customTexture.cloudCurl = textures/clouds/curl.dat TEXTURE_2D RGBA8 128 128 RGBA UNSIGNED_BYTE
# Regime map (begin.csh) and weather maps (begin_a.csh / begin_b.csh, 2 layers each)
image.cloudRegime = cloudRegimeSampler rgba rgba16f half_float false false 512 512
image.cloudWeatherNear = cloudWeatherNearSampler rgba rgba16f half_float false false 2048 2048 2
image.cloudWeatherFar = cloudWeatherFarSampler rgba rgba16f half_float false false 1024 1024 2
# Cloud shadow map (begin_c.csh) and sky capture with clouds (begin_d.csh, octahedral)
image.cloudShadow = cloudShadowSampler red r16f half_float false false 512 512
image.cloudSkyCapture = cloudSkyCaptureSampler rgba rgba16f half_float false false 512 512
# Ray march output (composite4_a.csh), internal resolution / CLOUD_RES
#if CLOUD_RES == 1
image.cloudRaw = cloudRawSampler rgba rgba16f half_float false true 0.51 0.51
#else
image.cloudRaw = cloudRawSampler rgba rgba16f half_float false true 0.26 0.26
#endif
# Temporal history, ping-pong (composite4_b.csh), internal resolution
image.cloudHistA = cloudHistASampler rgba rgba16f half_float false true 0.51 0.51
image.cloudHistB = cloudHistBSampler rgba rgba16f half_float false true 0.51 0.51
#endif
