# ---- Physical atmosphere (lib/atmosphere/Atmosphere.inc) -------------------------------------
#if defined VOLUMETRIC_CLOUDS || ATMOSPHERE_MODEL == 1 || GI_METHOD == 1
iris.features.required = COMPUTE_SHADERS CUSTOM_IMAGES
#endif
#if ATMOSPHERE_MODEL == 1
# LUTs: transmittance (begin_d.csh), multiple scattering (begin_e.csh), sky-view sun + moon (begin_f.csh)
image.atmoTransmittance = atmoTransmittanceSampler rgba rgba16f half_float false false 256 64
image.atmoMultiScat = atmoMultiScatSampler rgba rgba16f half_float false false 32 32
image.atmoSkyView = atmoSkyViewSampler rgba rgba16f half_float false false 192 216
#endif

# ReSTIR GI (lib/gi/GiRestir.glsl): reservoirs (two pairs, swapped every frame) and result, internal resolution
#if GI_METHOD == 1
image.giResA0 = giResA0Sampler rgba_integer rgba32ui unsigned_int false true 0.51 0.51
image.giResB0 = giResB0Sampler rgba_integer rgba32ui unsigned_int false true 0.51 0.51
image.giResA1 = giResA1Sampler rgba_integer rgba32ui unsigned_int false true 0.51 0.51
image.giResB1 = giResB1Sampler rgba_integer rgba32ui unsigned_int false true 0.51 0.51
image.giRestirOut = giRestirOutSampler rgba rgba16f half_float false true 0.51 0.51
#endif

# ---- Volumetric clouds (lib/clouds) -------------------------------------------------------
#ifdef VOLUMETRIC_CLOUDS
customTexture.cloudNoiseBase = textures/clouds/noise_base.dat TEXTURE_3D RGBA8 128 128 128 RGBA UNSIGNED_BYTE
customTexture.cloudNoiseDetail = textures/clouds/noise_detail.dat TEXTURE_3D RGBA8 64 64 64 RGBA UNSIGNED_BYTE
customTexture.cloudCurl = textures/clouds/curl.dat TEXTURE_2D RGBA8 128 128 RGBA UNSIGNED_BYTE
customTexture.cloudCirrus = textures/clouds/cirrus.dat TEXTURE_2D RGBA8 512 512 RGBA UNSIGNED_BYTE
# Regime map (begin.csh) and weather maps (begin_a.csh / begin_b.csh, 2 layers each)
image.cloudRegime = cloudRegimeSampler rgba rgba16f half_float false false 512 512
image.cloudWeatherNear = cloudWeatherNearSampler rgba rgba16f half_float false false 2048 2048 2
image.cloudWeatherFar = cloudWeatherFarSampler rgba rgba16f half_float false false 1024 1024 2
# Cloud shadow map (begin_h.csh) and sky capture with clouds (begin_d.csh, octahedral)
image.cloudShadow = cloudShadowSampler rgba rgba16f half_float false false 768 512
# Empty space skip map (begin_c.csh): 3 levels of tiles, see the program
image.cloudSkip = cloudSkipSampler rgba rgba16f half_float false false 256 336
image.cloudSkyCapture = cloudSkyCaptureSampler rgba rgba16f half_float false false 512 512
# Ray march output (composite4_a.csh), internal resolution / CLOUD_RES
#if CLOUD_RES == 1
image.cloudRaw = cloudRawSampler rgba rgba16f half_float false true 0.51 0.51
#else
image.cloudRaw = cloudRawSampler rgba rgba16f half_float false true 0.26 0.26
#endif
# Temporal history, ping-pong (composite4_b.csh), internal resolution
image.cloudHistA = cloudHistASampler rgba rgba16f half_float false true 0.51 0.51
image.cloudHistB = cloudHistBSampler rgba rgba16f half_float false true 0.51 0.51
# Light in the lower air (crepuscular rays, valley haze) at the ray march resolution (composite4_c.csh)
#if ATMOSPHERE_MODEL == 1
image.airLightA = airLightASampler rgba rgba16f half_float false true 0.26 0.26
image.airLightB = airLightBSampler rgba rgba16f half_float false true 0.26 0.26
#endif
#endif
# Distant terrain shading (deferred12_c.csh): quarter of the internal resolution
#ifdef AB_FAR_SHADING
image.farShade = farShadeSampler rgba rgba16f half_float false true 0.26 0.26
# World height map of the terrain seen by the camera (deferred12_a/b/c, lib/FarShading.inc)
image.farHeight = farHeightSampler red_integer r32ui unsigned_int false false 2048 2048
image.farHeightState = farHeightStateSampler rgba_integer rgba32i int false false 1 1
#endif
# Progressive bloom (composite14_a .. composite14_i): same atlas layout as colortex7
image.bloomAccum = bloomAccumSampler rgba rgba16f half_float false true 1.0 1.0
