        screen.Clouds = VOLUMETRIC_CLOUDS CLOUD_DEBUG_VIEW <empty> <empty> [CloudQuality] [CloudWorld] [CloudLighting]
            screen.CloudQuality = CLOUD_QUALITY CLOUD_RES CLOUD_TEMPORAL CLOUD_MAX_DISTANCE <empty> <empty> \
